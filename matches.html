<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matches — KCL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://oaznjrsrkrxnsvqdrsxb.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <script>try{var __s=JSON.parse(localStorage.getItem("kclwind_session")||"null");if(!__s||__s.role!=="owner")document.documentElement.classList.add("no-owner-links")}catch(e){document.documentElement.classList.add("no-owner-links")}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
        <img class="brand-logo brand-logo-img" src="img/logo.jpeg" alt="KCL" />
        <div>
          <h1 class="brand-name">KCL</h1>
          <p class="brand-tag">Cricket Auction Portal</p>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="tournament.html">Tournament</a>
        <a href="auction.html">Auction</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="standings.html">Standings</a>
        <a href="my-auction.html">My Auction</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
        <a href="links.html">Links</a>
        <a href="notes.html">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="my-matches-section" class="card hidden">
      <div class="section-head">
        <h2>My Matches</h2>
      </div>
      <div id="my-matches-list" class="item-list"></div>
    </section>

    <section id="fixtures-card" class="card hidden">
      <div class="section-head">
        <h2>Fixtures</h2>
        <div id="fixtures-counter" class="item-sub"></div>
      </div>
      <div id="fixtures-list" class="fixtures-list"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>League Matches</h2>
        <button class="btn btn-primary hidden" id="add-match">+ Add Match</button>
      </div>
      <form id="match-form" class="edit-form hidden">
        <label>Team 1
          <select name="team1" required></select>
        </label>
        <label>Team 2
          <select name="team2" required></select>
        </label>
        <label>Date &amp; Time<input type="datetime-local" name="date" /></label>
        <label>Overs<input type="number" name="overs" min="1" max="50" value="20" /></label>
        <label>Venue<input type="text" name="venue" placeholder="Ground / Venue" /></label>
        <label>Tournament
          <select name="tournament"><option value="">— None —</option></select>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-cancel" data-cancel="match">Cancel</button>
        </div>
      </form>
      <div id="matches-list" class="item-list"></div>
    </section>

    <section id="playoffs-section" class="card">
      <div class="section-head">
        <h2>Playoffs</h2>
      </div>
      <div id="playoffs-list" class="item-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> KCL Cricket Auction. All rights reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
