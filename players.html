<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Players — KCL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://oaznjrsrkrxnsvqdrsxb.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <script>try{var __s=JSON.parse(localStorage.getItem("kclwind_session")||"null");if(!__s||__s.role!=="owner")document.documentElement.classList.add("no-owner-links")}catch(e){document.documentElement.classList.add("no-owner-links")}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
        <img class="brand-logo brand-logo-img" src="img/logo.jpeg" alt="KCL" />
        <div>
          <h1 class="brand-name">KCL</h1>
          <p class="brand-tag">Cricket Auction Portal</p>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="tournament.html">Tournament</a>
        <a href="auction.html">Auction</a>
        <a href="matches.html">Matches</a>
        <a href="standings.html">Standings</a>
        <a href="my-auction.html">My Auction</a>
        <a href="teams.html">Teams</a>
        <a href="players.html" class="active">Players</a>
        <a href="links.html">Links</a>
        <a href="notes.html">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="players" class="card">
      <div class="section-head">
        <h2>Players</h2>
        <button class="btn btn-primary" id="add-players">+ Add Player</button>
      </div>
      <div id="players-list" class="item-list"></div>
      <form id="players-form" class="edit-form hidden">
        <label>Player Name<input type="text" name="name" required /></label>
        <label>Role</label>
        <select name="role" class="role-select-hidden">
          <option>Batsman</option><option>Bowler</option><option>All-Rounder</option>
          <option>Wicket-Keeper</option><option>Coach</option>
        </select>
        <div class="role-picker" data-target="role">
          <button type="button" class="role-btn" data-role="Batsman"><span class="role-ico">🏏</span>Batsman</button>
          <button type="button" class="role-btn" data-role="Bowler"><span class="role-ico">🔴</span>Bowler</button>
          <button type="button" class="role-btn" data-role="Wicket-Keeper"><span class="role-ico">🧤</span>Wicket Keeper</button>
          <button type="button" class="role-btn" data-role="All-Rounder"><span class="role-ico">⚡</span>All Rounder</button>
        </div>
        <label>Base Price (₹)<input type="number" name="basePrice" min="0" value="0" /></label>
        <label>Associated Team
          <select name="team"><option value="">— None —</option></select>
        </label>
        <label id="f-icon">Icon Player For (Team)
          <select name="iconFor"><option value="">— None —</option></select>
        </label>

        <label id="f-captain">Captain/Owner For (Team)
          <select name="captainFor"><option value="">— None —</option></select>
        </label>
        <label>Player Photo
          <input type="file" name="photo" accept="image/*" />
        </label>
        <img id="photo-preview" class="photo-preview hidden" alt="Player photo preview" />
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-cancel" data-cancel="players">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> KCL Cricket Auction. All rights reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
