<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Auction — KCL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://oaznjrsrkrxnsvqdrsxb.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <script>try{var __s=JSON.parse(localStorage.getItem("kclwind_session")||"null");if(!__s||__s.role!=="owner")document.documentElement.classList.add("no-owner-links")}catch(e){document.documentElement.classList.add("no-owner-links")}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
        <img class="brand-logo brand-logo-img" src="img/logo.jpeg" alt="KCL" />
        <div>
          <h1 class="brand-name">KCL</h1>
          <p class="brand-tag">Cricket Auction Portal</p>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="tournament.html">Tournament</a>
        <a href="auction.html">Auction</a>
        <a href="matches.html">Matches</a>
        <a href="standings.html">Standings</a>
        <a href="my-auction.html" class="active">My Auction</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
        <a href="links.html">Links</a>
        <a href="notes.html">Notes</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="my-auction" class="card accent-card">
      <div class="section-head">
        <h2>My Auction</h2>
        <button class="btn btn-edit" data-edit="my-auction">Edit</button>
      </div>
      <div id="my-auction-view" class="detail-grid">
        <div class="detail"><span class="label">Auction Team</span><span class="value" data-field="team">—</span></div>
        <div class="detail"><span class="label">Purse (₹)</span><span class="value" data-field="purse">—</span></div>
        <div class="detail"><span class="label">Remaining Purse (₹)</span><span class="value" id="my-auction-remaining">—</span></div>
        <div class="detail"><span class="label">Status</span><span class="value" data-field="status">—</span></div>
        <div class="detail"><span class="label">Associated Tournament</span><span class="value" data-field="tournament">—</span></div>
        <div class="detail"><span class="label">Associated Auction</span><span class="value" data-field="auction">—</span></div>
      </div>
      <form id="my-auction-form" class="edit-form hidden">
        <label>Auction Team<input type="text" name="team" required /></label>
        <label>Purse (₹)<input type="number" name="purse" min="0" value="0" /></label>
        <label>Status
          <select name="status">
            <option>Registered</option><option>Confirmed</option><option>Pending</option><option>Withdrawn</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-cancel" data-cancel="my-auction">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> KCL Cricket Auction. All rights reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
